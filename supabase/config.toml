# Local Supabase settings (`supabase start`). Hosted projects: set the same values in the dashboard.
project_id = "baytar"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# US-30: stay signed in for 30 days.
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.sessions]
timebox = "720h"

[auth.email]
enable_signup = true
# US-29 / US-31: a 6-digit code, valid for 10 minutes, must be entered before the account is active.
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "رمز تفعيل حسابك في بيطار"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "إعادة تعيين كلمة المرور في بيطار"
content_path = "./supabase/templates/recovery.html"

# Real email goes through Gmail SMTP (set the password with `supabase secrets` / dashboard, never in git).
# [auth.email.smtp]
# enabled = true
# host = "smtp.gmail.com"
# port = 587
# user = "baytar.app@gmail.com"
# pass = "env(SMTP_PASSWORD)"
# admin_email = "baytar.app@gmail.com"
# sender_name = "Baytar"

[functions.sign-in]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

[functions.consultation-token]
verify_jwt = true
